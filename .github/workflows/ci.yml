name: Cleanleaf CI

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main

jobs:
  validate:
    name: Validation Suite
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js 20.x
        uses: actions/setup-node@v4
        with:
          node-version: "20.x"
          cache: "pnpm"

      - name: Install Dependencies
        run: pnpm install --frozen-lockfile

      - name: TypeScript Check
        run: pnpm check

      - name: Test Suite
        run: pnpm test

      - name: Production Build
        run: pnpm build

      - name: Audit Secret Exposure in Diff
        run: |
          echo "Auditing pull request diff for secret exposure..."
          if git rev-parse --verify origin/main >/dev/null 2>&1; then
            DIFF_FILES=$(git diff origin/main...HEAD -- ':!.github/workflows/ci.yml')
          else
            DIFF_FILES=$(git diff HEAD~1..HEAD -- ':!.github/workflows/ci.yml')
          fi

          if echo "$DIFF_FILES" | grep -Ei "SUPABASE_SERVICE_ROLE_[K]EY=ey|COPERNICUS_CLIENT_[S]ECRET=sh-|sk_live_|sb_secret_"; then
            echo "ERROR: Potential hardcoded secret detected in diff!"
            exit 1
          fi
          echo "Secret audit passed: No hardcoded secrets detected in diff."
