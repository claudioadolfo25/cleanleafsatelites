name: Cleanleaf CI

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main

jobs:
  validate:
    name: Validation Suite
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js 20.x
        uses: actions/setup-node@v4
        with:
          node-version: "20.x"
          cache: "pnpm"

      - name: Install Dependencies
        run: pnpm install --frozen-lockfile

      - name: TypeScript Check
        run: pnpm check

      - name: Test Suite
        run: pnpm test

      - name: Production Build
        run: pnpm build

      - name: Audit Secret Exposure in Diff
        run: |
          echo "Auditing pull request diff for secret exposure..."
          BASE_REF="${{ github.base_ref }}"
          if [ -n "$BASE_REF" ] && git rev-parse --verify "origin/$BASE_REF" >/dev/null 2>&1; then
            DIFF_TEXT=$(git diff "origin/$BASE_REF...HEAD")
          elif git rev-parse --verify origin/main >/dev/null 2>&1; then
            DIFF_TEXT=$(git diff origin/main...HEAD)
          else
            DIFF_TEXT=$(git diff HEAD~1..HEAD)
          fi

          # Define regex components dynamically to prevent self-matching against this workflow file
          P1="SUPABASE_SERVICE_ROLE_"
          P2="COPERNICUS_CLIENT_"
          P3="sk_live"
          P4="sb_secret"
          PATTERN="${P1}KEY=ey|${P2}SECRET=sh-|${P3}_|${P4}_"

          if echo "$DIFF_TEXT" | grep -Ei "$PATTERN"; then
            echo "ERROR: Potential hardcoded secret detected in diff!"
            exit 1
          fi
          echo "Secret audit passed: No hardcoded secrets detected in diff."
