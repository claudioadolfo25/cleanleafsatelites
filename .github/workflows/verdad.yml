name: Verdad DB Reset

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main

jobs:
  db-reset:
    name: db-reset
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Install psql client if needed
        run: |
          if ! command -v psql &> /dev/null; then
            sudo apt-get update && sudo apt-get install -y postgresql-client
          fi

      - name: Run Supabase start and db reset
        run: |
          supabase start
          supabase db reset

      - name: Verify audit_logs RLS Policies and Isolation Test
        run: |
          DB_URL="postgresql://postgres:postgres@127.0.0.1:54322/postgres"

          echo "== Checking audit_logs SELECT policies =="
          psql "$DB_URL" -v ON_ERROR_STOP=1 -c "
          DO \$\$
          DECLARE
            v_count_admin INT;
            v_count_tenant_admin_owner INT;
            v_count_super_admin INT;
          BEGIN
            SELECT count(*) INTO v_count_admin
            FROM pg_policies
            WHERE tablename = 'audit_logs' AND policyname = 'audit_logs_select_admin';

            SELECT count(*) INTO v_count_tenant_admin_owner
            FROM pg_policies
            WHERE tablename = 'audit_logs' AND policyname = 'audit_logs_select_tenant_admin_owner';

            SELECT count(*) INTO v_count_super_admin
            FROM pg_policies
            WHERE tablename = 'audit_logs' AND policyname = 'audit_logs_select_super_admin';

            IF v_count_admin > 0 THEN
              RAISE EXCEPTION 'POLICY CHECK FAILED: Legacy policy audit_logs_select_admin still exists!';
            END IF;

            IF v_count_tenant_admin_owner = 0 THEN
              RAISE EXCEPTION 'POLICY CHECK FAILED: Expected policy audit_logs_select_tenant_admin_owner is missing!';
            END IF;

            IF v_count_super_admin = 0 THEN
              RAISE EXCEPTION 'POLICY CHECK FAILED: Expected policy audit_logs_select_super_admin is missing!';
            END IF;

            RAISE NOTICE 'POLICY CHECK PASSED: audit_logs SELECT policies are correctly configured.';
          END \$\$;
          "

          echo "== Checking audit_logs INSERT policies (Migration 012) =="
          psql "$DB_URL" -v ON_ERROR_STOP=1 -c "
          DO \$\$
          DECLARE
            v_count_insert INT;
          BEGIN
            SELECT count(*) INTO v_count_insert
            FROM pg_policies
            WHERE tablename = 'audit_logs' AND cmd = 'INSERT';

            IF v_count_insert > 0 THEN
              RAISE EXCEPTION 'POLICY CHECK FAILED: Permissive INSERT policy on audit_logs still exists!';
            END IF;

            RAISE NOTICE 'POLICY CHECK PASSED: Direct INSERT on audit_logs is restricted for ordinary roles.';
          END \$\$;
          "

          echo "== Read-Only CI Environment & Role Diagnostic =="
          psql "$DB_URL" -v ON_ERROR_STOP=1 -c "
          DO \$\$
          DECLARE
            v_roles TEXT;
            v_memberships TEXT;
          BEGIN
            RAISE NOTICE 'DIAGNOSTIC: session_user=%, current_user=%', session_user, current_user;

            SELECT string_agg(
              rolname || ' (super=' || rolsuper || ', bypassrls=' || rolbypassrls || ', canlogin=' || rolcanlogin || ')',
              '; '
            )
            INTO v_roles
            FROM pg_roles
            WHERE rolname IN ('postgres', 'supabase_admin', 'supabase_auth_admin', 'service_role', 'authenticated', 'anon');

            RAISE NOTICE 'DIAGNOSTIC: Role Attributes: %', v_roles;

            SELECT string_agg(
              'grantee=' || m.roleid::regrole || ' -> role=' || m.member::regrole ||
              ' (admin_opt=' || m.admin_option || ', inherit_opt=' || m.inherit_option || ', set_opt=' || m.set_option || ')',
              '; '
            )
            INTO v_memberships
            FROM pg_auth_members m;

            RAISE NOTICE 'DIAGNOSTIC: Role Memberships: %', COALESCE(v_memberships, 'None');
          END \$\$;
          "

          echo "== Executing RLS Isolation Assertion Suites =="
          psql "$DB_URL" -v ON_ERROR_STOP=1 -f supabase/tests/test_011_audit_logs_rls.sql
          psql "$DB_URL" -v ON_ERROR_STOP=1 -f supabase/tests/test_012_audit_logs_insert_rls.sql
          psql "$DB_URL" -v ON_ERROR_STOP=1 -f supabase/tests/test_013_table_permissions_and_hook_rls.sql
