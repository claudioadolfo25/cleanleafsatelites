name: Verdad DB Reset

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main

jobs:
  db-reset:
    name: db-reset
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Install psql client if needed
        run: |
          if ! command -v psql &> /dev/null; then
            sudo apt-get update && sudo apt-get install -y postgresql-client
          fi

      - name: Run Supabase start and db reset
        run: |
          supabase start
          supabase db reset

      - name: Verify audit_logs RLS Policies and Isolation Test
        run: |
          DB_URL="postgresql://postgres:postgres@127.0.0.1:54322/postgres"

          echo "== Checking audit_logs SELECT policies =="
          psql "$DB_URL" -v ON_ERROR_STOP=1 -c "
          DO \$\$
          DECLARE
            v_count_admin INT;
            v_count_tenant_admin_owner INT;
            v_count_super_admin INT;
          BEGIN
            SELECT count(*) INTO v_count_admin
            FROM pg_policies
            WHERE tablename = 'audit_logs' AND policyname = 'audit_logs_select_admin';

            SELECT count(*) INTO v_count_tenant_admin_owner
            FROM pg_policies
            WHERE tablename = 'audit_logs' AND policyname = 'audit_logs_select_tenant_admin_owner';

            SELECT count(*) INTO v_count_super_admin
            FROM pg_policies
            WHERE tablename = 'audit_logs' AND policyname = 'audit_logs_select_super_admin';

            IF v_count_admin > 0 THEN
              RAISE EXCEPTION 'POLICY CHECK FAILED: Legacy policy audit_logs_select_admin still exists!';
            END IF;

            IF v_count_tenant_admin_owner = 0 THEN
              RAISE EXCEPTION 'POLICY CHECK FAILED: Expected policy audit_logs_select_tenant_admin_owner is missing!';
            END IF;

            IF v_count_super_admin = 0 THEN
              RAISE EXCEPTION 'POLICY CHECK FAILED: Expected policy audit_logs_select_super_admin is missing!';
            END IF;

            RAISE NOTICE 'POLICY CHECK PASSED: audit_logs SELECT policies are correctly configured.';
          END \$\$;
          "

          echo "== Checking audit_logs INSERT policies (Migration 012) =="
          psql "$DB_URL" -v ON_ERROR_STOP=1 -c "
          DO \$\$
          DECLARE
            v_count_insert INT;
          BEGIN
            SELECT count(*) INTO v_count_insert
            FROM pg_policies
            WHERE tablename = 'audit_logs' AND cmd = 'INSERT';

            IF v_count_insert > 0 THEN
              RAISE EXCEPTION 'POLICY CHECK FAILED: Permissive INSERT policy on audit_logs still exists!';
            END IF;

            RAISE NOTICE 'POLICY CHECK PASSED: Direct INSERT on audit_logs is restricted for ordinary roles.';
          END \$\$;
          "

          echo "== Read-only inspection of Supabase DB role state =="
          echo "== supabase --version =="
          supabase --version

          echo "== session_user/current_user =="
          psql "$DB_URL" -v ON_ERROR_STOP=0 -X -A -F $'\t' -c "
          SELECT
            session_user,
            current_user;
          "

          echo "== Attributes for postgres, supabase_admin and supabase_auth_admin =="
          psql "$DB_URL" -v ON_ERROR_STOP=0 -X -A -F $'\t' -c "
          SELECT
            rolname,
            rolsuper,
            rolbypassrls,
            rolcanlogin,
            rolcreaterole
          FROM pg_roles
          WHERE rolname IN ('postgres', 'supabase_admin', 'supabase_auth_admin')
          ORDER BY rolname;
          "

          echo "== pg_auth_members (grantor, admin_option, set_option, inherit_option) =="
          psql "$DB_URL" -v ON_ERROR_STOP=0 -X -A -F $'\t' -c "
          SELECT
            r.rolname AS rol,
            m.member::regrole::text AS miembro,
            m.grantor::regrole::text AS grantor,
            m.admin_option,
            m.set_option,
            m.inherit_option
          FROM pg_auth_members m
          JOIN pg_roles r
            ON r.oid = m.roleid
          ORDER BY r.rolname, m.member, m.grantor;
          "

          echo "== TCP connection test as supabase_admin (non-fatal) =="
          set +e
          tcp_status=1
          tcp_error_type=""
          for attempt in 1 2; do
            case "$attempt" in
              1) cred="supabase_admin" ;;
              2) cred="postgres" ;;
            esac

            echo "attempt $attempt/2"
            PGPASSWORD="$cred" \
            psql "postgresql://supabase_admin@127.0.0.1:54322/postgres" \
              -v ON_ERROR_STOP=0 -X -A -F $'\t' -c "
                SELECT
                  session_user,
                  current_user,
                  (SELECT rolsuper FROM pg_roles WHERE rolname = current_user) AS is_super,
                  (SELECT rolcreaterole FROM pg_roles WHERE rolname = current_user) AS can_createrole;
              " >/tmp/supabase_admin_tcp_check.txt 2>/tmp/supabase_admin_tcp_check.err
            tcp_status=$?

            if [ "$tcp_status" -eq 0 ]; then
              echo "supabase_admin TCP connection: OK"
              cat /tmp/supabase_admin_tcp_check.txt
              break
            fi

            if grep -qi "password authentication failed" /tmp/supabase_admin_tcp_check.err; then
              tcp_error_type="auth"
              echo "attempt $attempt/2 failed; retrying"
              continue
            fi

            tcp_error_type="non-auth"
            echo "supabase_admin TCP connection: FAILED (non-auth)"
            cat /tmp/supabase_admin_tcp_check.err
            break
          done

          if [ "$tcp_status" -ne 0 ] && [ -z "$tcp_error_type" ]; then
            tcp_error_type="auth"
          fi

          if [ "$tcp_status" -ne 0 ]; then
            echo "supabase_admin TCP connection: FAILED ($tcp_error_type)"
          fi
          set -e

          echo "== Executing RLS Isolation Assertion Suites =="
          psql "$DB_URL" -v ON_ERROR_STOP=1 -f supabase/tests/test_011_audit_logs_rls.sql
          psql "$DB_URL" -v ON_ERROR_STOP=1 -f supabase/tests/test_012_audit_logs_insert_rls.sql
          psql "$DB_URL" -v ON_ERROR_STOP=1 -f supabase/tests/test_013_table_permissions_and_hook_rls.sql
