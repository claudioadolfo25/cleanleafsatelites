name: Verdad DB Reset

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main

jobs:
  db-reset:
    name: db-reset
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Run Supabase start and db reset
        run: |
          supabase start
          supabase db reset
